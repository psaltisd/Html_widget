<div style="font-family:sans-serif;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;white-space:nowrap;">
  <span>🌡️ Temp: <span id="temp">--</span>°C</span>
  <span>💧 Hum: <span id="humidity">--</span>%</span>
  <span>☁️ Cloud: <span id="cloud">--</span>%</span>
  <span>🌧️ Precip: <span id="precip">--</span> mm</span>
  <span>💨 Wind: <span id="wind">--</span> km/h</span>
  <span>🧭 Dir: <span id="dir">--</span>°</span>
  <span>🌬️ Dust: <span id="dust" class="aqi">--</span> µg/m³</span>
  <span>🌫️ PM2.5: <span id="pm25" class="aqi">--</span> µg/m³</span>
  <span>🌪️ PM10: <span id="pm10" class="aqi">--</span> µg/m³</span>
  <span>🧪 NO₂: <span id="no2" class="aqi">--</span> µg/m³</span>
  <span>☁️ O₃: <span id="o3" class="aqi">--</span> µg/m³</span>
  <span>🔥 CO: <span id="co" class="aqi">--</span> µg/m³</span>
</div>

<style>
  .good { color: green; font-weight: bold; }
  .moderate { color: orange; }
  .bad { color: red; font-weight: bold; }
</style>

<script>
  // Weather API
  fetch("https://api.open-meteo.com/v1/forecast?latitude=37.875&longitude=23.75&current=temperature_2m,relative_humidity_2m,cloud_cover,precipitation,wind_speed_10m,wind_direction_10m&timezone=Europe%2FAthens")
    .then(res => res.json())
    .then(data => {
      const c = data.current;
      document.getElementById("temp").textContent = c.temperature_2m;
      document.getElementById("humidity").textContent = c.relative_humidity_2m;
      document.getElementById("cloud").textContent = c.cloud_cover;
      document.getElementById("precip").textContent = c.precipitation;
      document.getElementById("wind").textContent = c.wind_speed_10m;
      document.getElementById("dir").textContent = c.wind_direction_10m;
    });

  // Air Quality API
  fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.8901&longitude=23.7441&current=aerosol_optical_depth,dust,pm10,pm2_5,ozone,sulphur_dioxide,nitrogen_dioxide,carbon_monoxide")
    .then(r => r.json())
    .then(d => {
      let c = d.current;

      const thresholds = {
        pm2_5: 15,
        pm10: 45,
        nitrogen_dioxide: 25,
        ozone: 100,
        carbon_monoxide: 4000,
        dust: 150 // assumed
      };

      function setAQI(id, value, limit) {
        const el = document.getElementById(id);
        el.textContent = value;
        if (value <= limit) {
          el.classList.add("good");
        } else if (value <= limit * 2) {
          el.classList.add("moderate");
        } else {
          el.classList.add("bad");
        }
      }

      setAQI("dust", c.dust, thresholds.dust);
      setAQI("pm25", c.pm2_5, thresholds.pm2_5);
      setAQI("pm10", c.pm10, thresholds.pm10);
      setAQI("no2", c.nitrogen_dioxide, thresholds.nitrogen_dioxide);
      setAQI("o3", c.ozone, thresholds.ozone);
      setAQI("co", c.carbon_monoxide, thresholds.carbon_monoxide);
    });
</script>
