<div id="loadingText" style="text-align:center; font-family: Arial; font-size: 24px;">
  Loading... 20s
</div>

<img src="x" style="display:none;" onerror="
let timeLeft = 20;
const text = document.getElementById('loadingText');

const countdown = setInterval(function() {
timeLeft--;
if (timeLeft > 0) {
text.innerHTML = 'Loading... ' + timeLeft + ' sec';
} else {
clearInterval(countdown);
text.innerHTML = 'Loading Completed. Click <b>Done</b>';
}
}, 1000);
">
