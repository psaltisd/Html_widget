<div id="loadingText" style="text-align:center; font-family: Arial; font-size: 22px;">
  Loading... 10s
</div>

<img src="x" onerror="
let timeLeft = 10;
const text = document.getElementById('loadingText');

const countdown = setInterval(function() {
timeLeft--;
if (timeLeft > 0) {
text.innerHTML = 'Loading... ' + timeLeft + ' sec';
} else {
clearInterval(countdown);
text.innerHTML = 'Loading completed, click "Done"';
}
}, 1000);
">
